name: Generar Estadísticas de GitHub

on:
  # Se ejecuta automáticamente todos los días a medianoche
  schedule: [{cron: "0 0 * * *"}]
  # Te permite ejecutarlo manualmente desde la pestaña "Actions"
  workflow_dispatch:
  # Se actualiza cuando haces cambios en el repositorio
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generar imagen SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: merinapiox
          template: classic
          base: header, repositories
          config_timezone: Europe/Madrid
          config_theme: dark
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
